name: Publish PyTransformKit v1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.0.0.yml"

permissions:
  contents: write

jobs:
  publish-github-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_VERSION: 1.0.0
      RELEASE_SHA: 5d2750b37bbba340dca2329886a8b47b77331111
    steps:
      - name: Check out qualified stable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify stable release freeze
        run: |
          python scripts/stable_release.py \
            --check contracts/stable_release_v1.json

      - name: Build stable artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Verify artifact version
        run: |
          python -m venv .publish-venv
          .publish-venv/bin/python -m pip install --upgrade pip
          .publish-venv/bin/python -m pip install dist/*.whl
          .publish-venv/bin/python - <<'PY'
          from importlib.metadata import version

          import pytransformkit

          assert version("pytransformkit") == "1.0.0"
          assert pytransformkit.__version__ == "1.0.0"
          PY

      - name: Generate artifact checksums
        run: |
          sha256sum dist/* | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create or verify v1.0.0 tag
        run: |
          existing="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            if [ "$existing" != "${RELEASE_SHA}" ]; then
              echo "::error::${RELEASE_TAG} already points to $existing, expected ${RELEASE_SHA}"
              exit 1
            fi
            echo "${RELEASE_TAG} already points to the qualified stable commit."
          else
            git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* SHA256SUMS --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/* SHA256SUMS \
              --verify-tag \
              --title "PyTransformKit 1.0.0" \
              --notes-file docs/RELEASE_NOTES_1_0_0.md \
              --latest
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" \
            --json tagName,name,isDraft,isPrerelease,targetCommitish,url
