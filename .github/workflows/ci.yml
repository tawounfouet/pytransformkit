name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/pytransformkit

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=pytransformkit --cov-report=term-missing

  pandas-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Pandas adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas]"
      - name: Run Pandas adapter contracts
        run: pytest tests/contract/engines/pandas -ra

  polars-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Polars adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,polars]"
      - name: Run Polars adapter contracts
        run: pytest tests/contract/engines/polars -ra

  cross-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install multi-engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas,polars]"
      - name: Run cross-engine contracts
        run: pytest tests/contract/cross_engine -ra

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import pytransformkit; print(pytransformkit.__version__)"
