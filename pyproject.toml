[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pytransformkit"
version = "1.2.0b4"
description = "Engine-agnostic data transformation framework for Python."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Thomas Awounfouet" },
]
keywords = [
  "data",
  "data-engineering",
  "transformation",
  "pandas",
  "polars",
  "pyarrow",
  "duckdb",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
cli = [
  "typer>=0.12,<1",
  "rich>=13,<15",
]
yaml = [
  "PyYAML>=6,<7",
]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6,<7",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
pandas = [
  "pandas>=2.2,<4",
]
polars = [
  "polars>=1.0,<2",
]
pyarrow = [
  "pyarrow>=20,<26",
]
duckdb = [
  "duckdb>=1.4,<2",
  "pyarrow>=20,<26",
]
io = [
  "pyarrow>=20,<26",
]
performance = [
  "pandas>=2.2,<4",
  "polars>=1.0,<2",
  "pyarrow>=20,<26",
  "duckdb>=1.4,<2",
]

[project.scripts]
ptk = "pytransformkit.cli.bootstrap:main"

[project.urls]
Repository = "https://github.com/tawounfouet/pytransformkit"
Issues = "https://github.com/tawounfouet/pytransformkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pytransformkit"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "unit: fast isolated tests",
  "architecture: architectural boundary tests",
  "contract: shared contract tests",
  "cross_engine: logical equivalence tests across engines",
  "integration: multi-component integration tests",
  "performance: benchmark or performance tests",
  "external: tests requiring external services",
  "slow: slow-running tests",
]

[tool.coverage.run]
source = ["pytransformkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "polars", "polars.*", "pyarrow", "pyarrow.*", "duckdb", "duckdb.*", "typer", "typer.*", "rich", "rich.*"]
ignore_missing_imports = true
