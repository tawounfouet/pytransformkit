name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/pytransformkit

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=pytransformkit --cov-report=term-missing

  pandas-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Pandas adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas]"
      - name: Run Pandas adapter contracts
        run: pytest tests/contract/engines/pandas -ra

  polars-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Polars adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,polars]"
      - name: Run Polars adapter contracts
        run: pytest tests/contract/engines/polars -ra

  cross-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install multi-engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas,polars]"
      - name: Run cross-engine contracts
        run: pytest tests/contract/cross_engine -ra

  pyarrow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyArrow adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pyarrow]"
      - name: Run PyArrow adapter contracts
        run: pytest tests/contract/engines/pyarrow -ra

  arrow-interchange-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Arrow interchange dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pyarrow,pandas,polars]"
      - name: Run Arrow interchange contracts
        run: pytest tests/contract/engines/pyarrow/test_interchange.py -ra

  duckdb-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install DuckDB adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,duckdb]"
      - name: Run DuckDB adapter contracts
        run: pytest tests/contract/engines/duckdb -ra

  duckdb-cross-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install relational contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas,polars,duckdb]"
      - name: Run DuckDB cross-engine contracts
        run: pytest tests/contract/cross_engine/test_duckdb_equivalence.py -ra

  io-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install physical I/O dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,pandas]"
      - name: Run physical I/O contracts
        run: pytest tests/contract/io -ra

  serialization-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install serialization contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yaml]"
      - name: Run versioned serialization and declarative bridge contracts
        run: |
          pytest tests/contract/serialization \
            tests/contract/schema_io/test_round_trip_wire_bridge.py -ra

  conformance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install full conformance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas,polars,pyarrow,duckdb,io]"
      - name: Run LOT-24 cross-engine conformance gate
        run: |
          pytest tests/contract/cross_engine tests/contract/conformance -ra

  plugin-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install plugin contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas,polars,pyarrow,duckdb,io]"
      - name: Run plugin and extension contracts
        run: |
          pytest tests/unit/application/extensions tests/contract/plugins -ra

  optimizer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optimizer contract dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pandas]"
      - name: Run logical optimizer contracts
        run: |
          pytest tests/unit/application/planning/test_expression_optimizer.py tests/unit/application/planning/test_logical_optimizer.py tests/contract/optimizer -ra

  performance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,performance]"
      - name: Run performance qualification tests
        run: pytest tests/performance -ra
      - name: Run LOT-25 benchmark budgets
        run: |
          python -m benchmarks.run \
            --profile ci \
            --output performance-report.json \
            --assert-budgets
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: pytransformkit-performance-report
          path: performance-report.json

  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install security qualification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,io,yaml]"
      - name: Run API and security contracts
        run: |
          pytest tests/contract/api tests/contract/security \
            tests/unit/schema_io/test_yaml_parser.py \
            tests/architecture/test_schema_io_boundaries.py \
            tests/contract/serialization/test_security_and_migrations.py \
            tests/contract/io -ra

  api-freeze-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build frozen wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel in clean environment
        run: |
          python -m venv .api-freeze-venv
          .api-freeze-venv/bin/python -m pip install --upgrade pip
          .api-freeze-venv/bin/python -m pip install dist/*.whl
          .api-freeze-venv/bin/python -m pip install \
            "pandas>=2.2,<4" \
            "polars>=1.0,<2" \
            "pyarrow>=20,<26" \
            "duckdb>=1.4,<2"
      - name: Verify built-wheel public API freeze
        run: |
          .api-freeze-venv/bin/python scripts/public_api_snapshot.py \
            --check contracts/public_api_v1.json
          .api-freeze-venv/bin/python scripts/public_api_snapshot.py \
            --line 1.1 \
            --check contracts/public_api_v1_1.json
      - name: Run Getting Started engine smoke
        run: |
          .api-freeze-venv/bin/python scripts/00_local_experimentation.py
      - name: Run Pandas engine guide
        run: |
          .api-freeze-venv/bin/python scripts/guides/pandas_engine.py
      - name: Run Polars engine guide
        run: |
          .api-freeze-venv/bin/python scripts/guides/polars_engine.py

  backwards-compatibility-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install compatibility qualification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify V1 and V1.1 error-code catalogues
        run: |
          python scripts/error_code_catalog.py \
            --check contracts/error_codes_v1.json
          python scripts/error_code_catalog.py \
            --line 1.1 \
            --check contracts/error_codes_v1_1.json
      - name: Verify V1 consumer compatibility snapshot
        run: |
          python scripts/consumer_compatibility.py \
            --check contracts/consumer_compatibility_v1.json
      - name: Run backwards-compatibility contracts
        run: |
          pytest tests/contract/release/test_backward_compatibility.py \
            tests/contract/api/test_declarative_schema_compatibility_freeze.py \
            tests/unit/application/extensions/test_compatibility.py -ra

  declarative-schema-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build declarative wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel with yaml extra
        run: |
          python -m venv .declarative-wheel-venv
          .declarative-wheel-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .declarative-wheel-venv/bin/python -m pip install             "pytransformkit[yaml] @ file://${WHEEL}"
          .declarative-wheel-venv/bin/python -m pip check
      - name: Run installed-wheel declarative smoke
        run: |
          .declarative-wheel-venv/bin/python scripts/declarative_artifact_smoke.py             --mode yaml
      - name: Verify installed-wheel 1.1 contracts
        run: |
          .declarative-wheel-venv/bin/python scripts/public_api_snapshot.py             --line 1.1             --check contracts/public_api_v1_1.json
          .declarative-wheel-venv/bin/python scripts/error_code_catalog.py             --line 1.1             --check contracts/error_codes_v1_1.json

  declarative-artifact-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Qualify core wheel without yaml
        run: |
          python -m venv .declarative-wheel-core
          .declarative-wheel-core/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .declarative-wheel-core/bin/python -m pip install "${WHEEL}"
          .declarative-wheel-core/bin/python -m pip check
          .declarative-wheel-core/bin/python scripts/declarative_artifact_smoke.py             --mode core
      - name: Qualify wheel yaml extra
        run: |
          python -m venv .declarative-wheel-yaml
          .declarative-wheel-yaml/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .declarative-wheel-yaml/bin/python -m pip install             "pytransformkit[yaml] @ file://${WHEEL}"
          .declarative-wheel-yaml/bin/python -m pip check
          .declarative-wheel-yaml/bin/python scripts/declarative_artifact_smoke.py             --mode yaml
      - name: Qualify core sdist without yaml
        run: |
          python -m venv .declarative-sdist-core
          .declarative-sdist-core/bin/python -m pip install --upgrade pip
          SDIST="$(realpath "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)")"
          .declarative-sdist-core/bin/python -m pip install "${SDIST}"
          .declarative-sdist-core/bin/python -m pip check
          .declarative-sdist-core/bin/python scripts/declarative_artifact_smoke.py             --mode core
      - name: Qualify sdist yaml extra
        run: |
          python -m venv .declarative-sdist-yaml
          .declarative-sdist-yaml/bin/python -m pip install --upgrade pip
          SDIST="$(realpath "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)")"
          .declarative-sdist-yaml/bin/python -m pip install             "pytransformkit[yaml] @ file://${SDIST}"
          .declarative-sdist-yaml/bin/python -m pip check
          .declarative-sdist-yaml/bin/python scripts/declarative_artifact_smoke.py             --mode yaml
          .declarative-sdist-yaml/bin/python scripts/public_api_snapshot.py             --line 1.1             --check contracts/public_api_v1_1.json
          .declarative-sdist-yaml/bin/python scripts/error_code_catalog.py             --line 1.1             --check contracts/error_codes_v1_1.json

  declarative-docs-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify declarative documentation surfaces
        run: |
          test -f docs/specifications/41_PYTRANSFORMKIT_DECLARATIVE_SCHEMA_GETTING_STARTED.md
          test -f docs/specifications/42_PYTRANSFORMKIT_DECLARATIVE_SCHEMA_REFERENCE_EXAMPLES.md
          grep -F 'pip install "pytransformkit[yaml]"' README.md
          grep -F 'pytransformkit.schema_io' README.md
          grep -F 'SchemaCodec' README.md
      - name: Build documentation qualification wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install wheel with yaml extra
        run: |
          python -m venv .declarative-docs-venv
          .declarative-docs-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .declarative-docs-venv/bin/python -m pip install \
            "pytransformkit[yaml] @ file://${WHEEL}"
          .declarative-docs-venv/bin/python -m pip check
      - name: Execute published declarative examples
        run: |
          .declarative-docs-venv/bin/python scripts/guides/declarative_schema.py
      - name: Recheck frozen 1.1 surface from documentation environment
        run: |
          .declarative-docs-venv/bin/python scripts/public_api_snapshot.py \
            --line 1.1 \
            --check contracts/public_api_v1_1.json
          .declarative-docs-venv/bin/python scripts/error_code_catalog.py \
            --line 1.1 \
            --check contracts/error_codes_v1_1.json

  release-qualification-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate LOT-27 release qualification manifest
        run: |
          python scripts/release_qualification.py \
            --check contracts/release_qualification_v1.json
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Qualify wheel in clean core environment
        run: |
          python -m venv .release-wheel-venv
          .release-wheel-venv/bin/python -m pip install --upgrade pip
          .release-wheel-venv/bin/python -m pip install dist/*.whl
          .release-wheel-venv/bin/python -m pip check
          .release-wheel-venv/bin/python - <<'PY'
          import importlib.util
          import tomllib
          from importlib.metadata import version
          from pathlib import Path

          import pytransformkit

          with Path("pyproject.toml").open("rb") as stream:
              expected_version = tomllib.load(stream)["project"]["version"]

          assert version("pytransformkit") == expected_version
          assert pytransformkit.__version__ == expected_version
          for module_name in ("pandas", "polars", "pyarrow", "duckdb"):
              assert importlib.util.find_spec(module_name) is None, module_name
          PY
      - name: Verify V1 compatibility from built wheel
        run: |
          .release-wheel-venv/bin/python scripts/error_code_catalog.py \
            --check contracts/error_codes_v1.json
          .release-wheel-venv/bin/python scripts/consumer_compatibility.py \
            --check contracts/consumer_compatibility_v1.json
      - name: Qualify sdist in clean environment
        run: |
          python -m venv .release-sdist-venv
          .release-sdist-venv/bin/python -m pip install --upgrade pip
          .release-sdist-venv/bin/python -m pip install dist/*.tar.gz
          .release-sdist-venv/bin/python -m pip check
          .release-sdist-venv/bin/python - <<'PY'
          import tomllib
          from importlib.metadata import version
          from pathlib import Path

          import pytransformkit

          with Path("pyproject.toml").open("rb") as stream:
              expected_version = tomllib.load(stream)["project"]["version"]

          assert version("pytransformkit") == expected_version
          assert pytransformkit.__version__ == expected_version
          PY

  stable-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install stable-release validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify LOT-28 stable release freeze
        run: |
          python scripts/stable_release.py \
            --check contracts/stable_release_v1.json
      - name: Run stable release contract tests
        run: |
          pytest tests/contract/release/test_stable_release.py \
            tests/contract/release/test_backward_compatibility.py -ra

  stable-declarative-release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install stable declarative release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,yaml]" twine
      - name: Verify V1 and V1.1 stable release freezes
        run: |
          python scripts/stable_release.py \
            --check contracts/stable_release_v1.json
          python scripts/stable_release.py \
            --check contracts/stable_release_v1_1.json
      - name: Run stable declarative release contracts
        run: |
          pytest tests/contract/release/test_stable_release.py \
            tests/contract/api/test_declarative_schema_compatibility_freeze.py \
            tests/contract/schema_io/test_round_trip_wire_bridge.py \
            tests/contract/security/test_declarative_schema_security_boundary.py -ra
      - name: Build and validate stable distributions
        run: |
          python -m build
          python -m twine check dist/*
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
      - name: Record stable artifact SHA-256
        run: |
          sha256sum dist/* | sort > stable-artifact-sha256.txt
          cat stable-artifact-sha256.txt
      - name: Upload stable artifact evidence
        uses: actions/upload-artifact@v4
        with:
          name: pytransformkit-stable-release-evidence
          path: |
            dist/
            stable-artifact-sha256.txt
          if-no-files-found: error
          retention-days: 30


  cli-schema-format-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CLI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cli]"
      - name: Run LOT-50 CLI tests
        run: |
          pytest tests/unit/cli \
            tests/contract/cli \
            tests/architecture/test_cli_boundaries.py -ra
      - name: Build LOT-50 wheel
        run: |
          python -m build --wheel
      - name: Qualify core wheel without CLI extra
        run: |
          python -m venv .cli-core-venv
          .cli-core-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .cli-core-venv/bin/python -m pip install "${WHEEL}"
          .cli-core-venv/bin/python -m pip check
          .cli-core-venv/bin/python - <<'PY'
          import importlib.util
          import pytransformkit

          assert pytransformkit.__version__
          assert importlib.util.find_spec("typer") is None
          assert importlib.util.find_spec("rich") is None
          PY
          set +e
          OUTPUT="$(
            .cli-core-venv/bin/ptk 2>&1
          )"
          STATUS=$?
          set -e
          test "${STATUS}" -eq 11
          printf '%s\n' "${OUTPUT}" | grep -F 'pip install "pytransformkit[cli]"'
      - name: Qualify wheel with CLI extra
        run: |
          python -m venv .cli-extra-venv
          .cli-extra-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .cli-extra-venv/bin/python -m pip install \
            "pytransformkit[cli] @ file://${WHEEL}"
          .cli-extra-venv/bin/python -m pip check
          .cli-extra-venv/bin/ptk --help
          .cli-extra-venv/bin/ptk version
          .cli-extra-venv/bin/ptk version --json
          .cli-extra-venv/bin/ptk --version
          .cli-extra-venv/bin/ptk doctor --no-color
          .cli-extra-venv/bin/ptk doctor --json
          .cli-extra-venv/bin/ptk schema --help
          .cli-extra-venv/bin/ptk schema validate --help
          .cli-extra-venv/bin/ptk schema inspect --help
          .cli-extra-venv/bin/ptk schema format --help
          cat > .cli-schema.yml <<'YAML'
          version: 1
          schema:
            name: customers
            fields:
              - name: customer_id
                type: int64
                nullable: false
          YAML
          set +e
          OUTPUT="$(
            .cli-extra-venv/bin/ptk schema validate .cli-schema.yml 2>&1
          )"
          STATUS=$?
          set -e
          test "${STATUS}" -eq 11
          printf '%s\n' "${OUTPUT}" | grep -F 'PTK-DECL-010'
          set +e
          OUTPUT="$(
            .cli-extra-venv/bin/ptk schema inspect .cli-schema.yml 2>&1
          )"
          STATUS=$?
          set -e
          test "${STATUS}" -eq 11
          printf '%s\n' "${OUTPUT}" | grep -F 'PTK-DECL-010'
          set +e
          OUTPUT="$(
            .cli-extra-venv/bin/ptk schema format .cli-schema.yml 2>&1
          )"
          STATUS=$?
          set -e
          test "${STATUS}" -eq 11
          printf '%s\n' "${OUTPUT}" | grep -F 'PTK-DECL-010'
          .cli-extra-venv/bin/python -m pytransformkit.cli --help
      - name: Qualify wheel with CLI and YAML extras
        run: |
          python -m venv .cli-yaml-venv
          .cli-yaml-venv/bin/python -m pip install --upgrade pip
          WHEEL="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          .cli-yaml-venv/bin/python -m pip install \
            "pytransformkit[cli,yaml] @ file://${WHEEL}"
          .cli-yaml-venv/bin/python -m pip check
          .cli-yaml-venv/bin/ptk schema validate .cli-schema.yml --no-color
          .cli-yaml-venv/bin/ptk schema validate .cli-schema.yml --json
          .cli-yaml-venv/bin/ptk schema inspect .cli-schema.yml --no-color
          .cli-yaml-venv/bin/ptk schema inspect .cli-schema.yml --json
          .cli-yaml-venv/bin/ptk schema format .cli-schema.yml > .cli-schema-formatted.yml
          .cli-yaml-venv/bin/ptk schema validate .cli-schema-formatted.yml --no-color
          cp .cli-schema.yml .cli-schema-write.yml
          .cli-yaml-venv/bin/ptk schema format .cli-schema-write.yml --write
          .cli-yaml-venv/bin/ptk schema validate .cli-schema-write.yml --no-color

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import pytransformkit; print(pytransformkit.__version__)"
