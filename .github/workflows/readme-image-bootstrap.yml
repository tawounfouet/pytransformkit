name: Bootstrap README framework image

on:
  push:
    branches: [docs/readme-framework-overview]
    paths:
      - ".github/workflows/readme-image-bootstrap.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-framework-overview
          fetch-depth: 0

      - name: Materialize README image
        run: |
          mkdir -p docs/assets
          BASE64_LENGTH="$(cat .github/tmp/readme-image/part-*.b64 | wc -c)"
          test "$BASE64_LENGTH" = "64108"
          cat .github/tmp/readme-image/part-*.b64 | base64 --decode \
            > docs/assets/pytransformkit-framework-overview.jpg

          python - <<'PY'
          from pathlib import Path

          image = Path("docs/assets/pytransformkit-framework-overview.jpg")
          payload = image.read_bytes()
          assert payload[:2] == b"\xff\xd8"
          assert payload[-2:] == b"\xff\xd9"
          assert len(payload) == 48081

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          anchor = (
              "PyTransformKit is an engine-agnostic Python framework for defining typed, "
              "composable data transformations independently from their physical execution engine.\n"
          )
          block = (
              "\n<p align=\"center\">\n"
              "  <img src=\"docs/assets/pytransformkit-framework-overview.jpg\"\n"
              "       alt=\"PyTransformKit framework overview\"\n"
              "       width=\"100%\">\n"
              "</p>\n"
          )
          if "docs/assets/pytransformkit-framework-overview.jpg" not in text:
              if anchor not in text:
                  raise SystemExit("README insertion anchor not found")
              text = text.replace(anchor, anchor + block, 1)
              readme.write_text(text, encoding="utf-8")
          PY

      - name: Remove bootstrap staging files
        run: |
          rm -rf .github/tmp/readme-image
          rm .github/workflows/readme-image-bootstrap.yml

      - name: Commit final README asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add framework overview to README"
          git push origin HEAD:docs/readme-framework-overview
